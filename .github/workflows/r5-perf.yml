# Fork only: where upstream master spends its time decoding a solid RAR5
# archive written by RAR 7.23, from perf on a hosted x86-64 runner.
name: RAR5 perf

on:
  push:
    branches: [bench-r5]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: bitplane/rars
          ref: master
          path: rars
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build with frame pointers and symbols
        env:
          RUSTFLAGS: -C force-frame-pointers=yes
          CARGO_PROFILE_RELEASE_DEBUG: "line-tables-only"
        run: cd rars && cargo build --release -p rars-cli --locked
      - name: Archives written by RAR 7.23
        run: |
          (cd rars && cargo fetch --locked)
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 20 --connect-timeout 30 \
            -o /tmp/rar.tar.gz https://www.rarlab.com/rar/rarlinux-x64-723.tar.gz
          mkdir -p /opt/rar && tar -xzf /tmp/rar.tar.gz -C /opt/rar --strip-components=1
          python3 tools/scripts/decode-bench.py data work/data
          cd work/data
          /opt/rar/rar a -r -idq -ma5 -m3 -s ../solid.rar .
          /opt/rar/rar a -r -idq -ma5 -m3 ../default.rar .
      - name: perf
        run: |
          sudo apt-get install -y -qq linux-tools-common "linux-tools-$(uname -r)" >/dev/null || sudo apt-get install -y -qq linux-tools-generic >/dev/null
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          PERF=$(command -v perf || ls /usr/lib/linux-tools/*/perf | head -1)
          for a in solid default; do
            echo "=== $a"
            for i in 1 2; do /usr/bin/time -f "%e s %M KB" rars/target/release/rars --progress never --threads 1 test work/$a.rar >/dev/null; done
            "$PERF" record -q -F 2999 -g -o /tmp/$a.data rars/target/release/rars --progress never --threads 1 test work/$a.rar >/dev/null 2>&1
            "$PERF" report -i /tmp/$a.data --no-children --sort symbol --stdio 2>/dev/null | grep -E '^ +[0-9]' | head -30
            echo "--- with callers of the top memory functions"
            "$PERF" report -i /tmp/$a.data --no-children --sort symbol --stdio -G 2>/dev/null | grep -E 'memmove|memcpy|memset|page_fault|clear_page|rep_movs' -A12 | head -80
          done
